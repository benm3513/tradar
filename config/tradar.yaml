env: paper
exchange: binance_spot_testnet

data_source: rest_poll  # rest_poll or ws
min_move_bps: 2

rest_poll:
  interval_s: 0.5        # 2 Hz per symbol batch
  endpoint: ticker_book  # ticker_book or ticker_price

binance:
  data_rest_base_url: "https://api.binance.us/api"
  exec_rest_base_url: "https://testnet.binance.vision/api"
  exchange_info_url: "https://api.binance.us/api/v3/exchangeInfo"

symbol_registry:
  enabled: true
  poll_interval_s: 15
  quote_asset: USDT
  status: TRADING
  allowlist:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
  denylist: []
  emit_listing_events: true

ws:
  shard_size: 60
  stream_types:
    - bookTicker
  reconnect_backoff_s: [1, 2, 5, 10, 30]

runtime:
  candle_interval_s: 1
  log_level: INFO

# Live app / rule-based engine execution settings.
execution:
  fee_bps: 10
  entry_slippage_cap_pct: 0.0025
  exit_slippage_cap_pct: 0.0025
  max_spread_pct: 0.02

# Live app / rule-based engine risk settings.
risk:
  max_positions: 3
  cooldown_s: 0
  max_notional_per_trade_usd: 2000
  max_position_notional_usd: 3000
  max_daily_loss_usd: 100000
  max_orders_per_minute: 9999

strategies:
  algo1_new_listing_pump:
    enabled: true
    max_listing_age_s: 300
    pump_trigger_bps: 20
    max_spread_pct: 0.05
    take_profit_bps: 20
    stop_bps: 20
    exhaustion_reversal_bps: 5
    max_hold_s: 120
    notional_fraction: 0.10
    price_cap: null

  algo2_micro_momentum:
    enabled: false
    min_move_bps: 1
    take_profit_bps: 5
    stop_bps: 5
    max_hold_s: 60
    notional_fraction: 0.05
    price_cap: null

# ML replay / sweep settings only. These are intentionally isolated from the
# live app's top-level risk/execution/strategies sections to avoid conflicts.
ml_replay:
  db_path: tradarbot.db
  predictions_table: spike_model_predictions_v50_sig_importance_ensemble
  price_table: spike_base_rows
  context_table: spike_training_rows_v48_sig
  prediction_source: ensemble

  prob_threshold: 0.10
  min_prob_percentile: 0.985
  top_n: 1
  max_positions: 3

  ranking_mode: composite
  prob_zscore_weight: 1.0
  percentile_weight: 0.2
  volatility_weight: 0.35
  time_to_peak_weight: 0.25
  rank_score_min: null

  notional_per_trade: 2500
  min_notional_per_trade: 0
  initial_cash: 100000

  enable_dynamic_sizing: true
  prob_size_cap: 2.5
  vol_reference: 0.006
  vol_size_floor: 0.75
  vol_size_cap: 1.25
  combined_size_cap: 2.2

  enable_kelly_sizing: true
  kelly_fraction_scale: 0.40
  kelly_probability_mode: threshold_relative
  kelly_size_cap: 1.5

  take_profit_pct: 0.20
  stop_loss_pct: 0.06
  max_hold_hours: 24
  trailing_stop_pct: 0.05
  trailing_stop_activation_pct: 0.08
  partial_take_profit_pct: 0.10
  partial_take_profit_fraction: 0.5
  time_stop_hours: null
  time_stop_min_return_pct: 0.01

  enable_risk_manager: true
  max_daily_loss_usd: 4000
  max_total_exposure_usd: 20000
  max_total_exposure_pct: null
  max_exposure_per_symbol_usd: 7000
  cooldown_minutes_per_symbol: 120

  enable_drawdown_scaling: true
  max_drawdown_pct: 0.08
  drawdown_full_size_pct: 0.04
  drawdown_half_size_pct: 0.06
  drawdown_quarter_size_pct: 0.08
  drawdown_half_size_multiplier: 0.50
  drawdown_quarter_size_multiplier: 0.25

  enable_regime_gating: true
  regime_gating_mode: scale
  max_market_risk_off_score: 0.70
  max_market_dispersion_24h: null
  min_market_trend_strength_24h: null
  risk_off_size_multiplier: 0.20
  risk_off_score_raise: 0.0
